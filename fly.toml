# Fly.io deploy for search-service. The RECEIVE-ONLY NWC string + MACAROON_SECRET
# go in Fly secrets, NOT here:
#   fly secrets set RECEIVE_NWC_CONNECTION_STRING="nostr+walletconnect://..." \
#                   MACAROON_SECRET="$(node -e 'console.log(require(\"crypto\").randomBytes(32).toString(\"hex\"))')" \
#                   SEARXNG_URL="https://<your-searxng>.fly.dev"
#
# SearXNG runs as a SEPARATE Fly app (or any reachable instance). Only the
# receive-only invoice key lives on this box — never a spend key or nsec.

app = "llmops-search"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PRICE_SATS = "50"
  MACAROON_TTL_SECONDS = "900"
  # Audit to stderr so events stream into `fly logs` (machine FS is ephemeral).
  AUDIT_LOG_PATH = "/dev/stderr"
  # Ephemeral by design: combined with the 900s macaroon TTL the replay window
  # on a redeploy is bounded. Move to a volume if TTLs ever grow.
  REPLAY_STORE_PATH = "/tmp/replay-store.ndjson"

[http_service]
  internal_port = 8080
  force_https = true
  # "stop", not "suspend": a suspended process keeps its NWC relay websocket in
  # memory, and that socket goes dead while frozen — on 2026-10-07 the process had
  # been resumed from suspend since 2026-08-10 and every make_invoice failed with
  # "publish timeout". A stop means each wake is a fresh boot, so warmUp() reconnects.
  # min 1: a cold boot (fresh process + NWC relay warmUp) takes ~15 s, too slow for
  # 402index probes and impatient agents; warm requests answer in <1 s (2026-10-08).
  # "stop" still applies to any machine above the minimum.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
