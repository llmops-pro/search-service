# Private SearXNG backend for llmops-search. NO public IPs — reachable only
# via http://llmops-searxng.flycast:8080 inside the Fly private network.
app = "llmops-searxng"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
