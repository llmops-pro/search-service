# SearXNG for the llmops-search backend. Private Fly app — flycast only.
use_default_settings: true
server:
  # secret_key comes from the SEARXNG_SECRET env var (fly secrets set SEARXNG_SECRET=...).
  # The "ultrasecretkey" default below makes SearXNG REFUSE to start if the env is missing.
  secret_key: "ultrasecretkey"
  limiter: false
search:
  formats:
    - html
    - json
# Fly datacenter IPs get CAPTCHA'd / rate-limited by the default web engines
# (brave, duckduckgo, startpage) — on 2026-10-07 every query returned 0 results.
# bing + yandex answer from Fly; enable them as fallbacks so paid searches aren't empty.
engines:
  - name: bing
    disabled: false
  - name: yandex
    disabled: false
